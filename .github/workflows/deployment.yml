name: Deployment workflow

on:
  push:
    branches:
    - main
    - vrush_dev_feb_25
    - release*

jobs:
  docker-build:
    uses: ./.github/workflows/docker_build.yml
    with:
      WORKSPACE: ${{ github.ref_name }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  