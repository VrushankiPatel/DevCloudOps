name: Node.js Scan Static Analysis

on:
  push:
    branches:
      - main
  pull:
    branches:
      - main
      - vrush_dev_feb_25*

jobs:
  nodejs-scan:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Install node scanning tool
        uses: actions/setup-python@v4
        with:
          cache: "pip"   # cache pip to avoid installing in each run

      - name: Run njsscan
        run: |
          pip install njsscan
          /opt/homebrew/bin/njsscan .
        working-directory: ./coffee-project


